name: pcbuilderops

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Copia .env.example a .env antes de levantar el proyecto}
    volumes:
      - sqldata:/var/opt/mssql
      - ./scripts:/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q \"SELECT 1\" > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  api:
    build: .
    image: pcbuilderops-app
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      CONNECTION_STRING: "Server=db,1433;Database=PCBuilderOps;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
      DOCUMENTOS_RUTA: /app/documentos
    ports:
      - "5206:8080"
    volumes:
      - documentos:/app/documentos
    restart: unless-stopped

  # Servidor de correo de pruebas: recibe todo y lo muestra en http://localhost:8025 sin enviarlo a internet.
  # Para simular un servidor caído: docker compose stop mailpit
  mailpit:
    image: axllent/mailpit:v1.27.11
    ports:
      - "8025:8025"
    restart: unless-stopped

  # RF-NOT-09: procesador independiente de la cola. Corre una vez y termina: docker compose run --rm despachador
  despachador:
    build: .
    image: pcbuilderops-app
    profiles: ["herramientas"]
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      CONNECTION_STRING: "Server=db,1433;Database=PCBuilderOps;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
    entrypoint: ["dotnet", "/app/despachador/EmailDispatcher.dll"]

volumes:
  sqldata:
  documentos:
